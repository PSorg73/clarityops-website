<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're In — ClarityOp Systems</title>
    <meta name="robots" content="noindex">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy: #0f1b2d;
            --dark-blue: #1a2940;
            --accent: #3b82f6;
            --light-accent: #60a5fa;
            --white: #ffffff;
            --mid-gray: #94a3b8;
            --text: #1e293b;
            --text-light: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, var(--dark-blue) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--white);
            text-align: center;
            padding: 24px;
        }

        .card {
            max-width: 520px;
            width: 100%;
        }

        .checkmark {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.15);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            font-size: 1.75rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        p {
            color: var(--mid-gray);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            background: var(--accent);
            color: var(--white);
            transition: background 0.2s, transform 0.2s;
        }

        .btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .logo {
            position: fixed;
            top: 20px;
            left: 24px;
            color: var(--white);
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
        }

        .logo span { color: var(--light-accent); }
    </style>
</head>
<body>
    <a href="/" class="logo">Clarity<span>Op</span> Systems</a>

    <div class="card">
        <div class="checkmark">✓</div>
        <h1>You're in.</h1>
        <p>Weekly AI tips for business owners — real automations, zero hype. First one lands in your inbox soon.</p>
        <a href="/" class="btn">Back to the site</a>
    </div>
</body>
</html>
